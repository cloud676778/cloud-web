<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM · Nikolai</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
body{
  background:#000000;
  color:#ffffff;
  min-height:100vh;
  padding-bottom:180px;
}

.dm-header{
  position:sticky;
  top:0;
  background:#000;
  z-index:99;
  display:flex;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid #2a2a2c;
}
.dm-back{
  color:#0a84ff;
  text-decoration:none;
  font-size:16px;
}
.dm-title{
  flex:1;
  text-align:center;
}
.dm-name{
  font-size:15px;
}
.dm-status{
  font-size:12px;
  color:#757577;
}
.dm-dummy{
  width:32px;
}

.chat-container{
  padding:22px 14px;
}
.chat-timestamp{
  text-align:center;
  font-size:12.5px;
  color:#626264;
  margin:12px 0 20px;
}

.bubble-they{
  max-width:76%;
  background:#2c2c2e;
  color:#fff;
  padding:11px 16px;
  border-radius:20px 20px 20px 4px;
  margin-bottom:11px;
  font-size:15px;
  line-height:1.54;
  opacity:0;
  transform:translateY(7px);
  transition:all .36s ease;
}
.bubble-they.show{
  opacity:1;
  transform:translateY(0);
}

.bubble-me{
  max-width:76%;
  margin-left:auto;
  background:#0a84ff;
  color:#fff;
  padding:11px 16px;
  border-radius:20px 20px 4px 20px;
  margin-bottom:11px;
  font-size:15px;
  line-height:1.54;
  opacity:0;
  transform:translateY(7px);
  transition:all .36s ease;
}
.bubble-me.show{
  opacity:1;
  transform:translateY(0);
}

/* ✅横向排列｜固定输入框上方｜只有scale呼吸、无多余光效 */
.choice-wrap{
  position:fixed;
  bottom:72px;
  left:16px;
  right:16px;
  display:flex;
  flex-direction:row;
  justify-content:flex-end;
  gap:12px;
}
.choice-btn{
  background:#0a84ff;
  color:white;
  border:none;
  border-radius:999px;
  padding:12px 22px;
  font-size:14.5px;
  cursor:pointer;
  opacity:0;
  transform:scale(1);
  transition:all .36s ease;
}
.choice-btn.show{
  opacity:1;
  /* 仅放大缩小呼吸，幅度适中，没有光晕、没有扫光 */
  animation:breatheScale 2.1s ease-in-out infinite;
}
.choice-btn:active{
  background:#006eda;
}
@keyframes breatheScale{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
}

.fake-input{
  position:fixed;
  bottom:20px;
  left:16px;
  right:16px;
  background:#1c1c1e;
  border:1px solid #343436;
  border-radius:999px;
  padding:12px 20px;
  color:#767678;
  font-size:14px;
}
</style>
</head>
<body>

<div class="dm-header">
  <a href="index.html" class="dm-back">← 返回</a>
  <div class="dm-title">
    <div class="dm-name">Николай</div>
    <div class="dm-status">已送达</div>
  </div>
  <div class="dm-dummy"></div>
</div>

<div class="chat-container" id="chatBox">
  <div class="chat-timestamp">今天</div>
  <div class="bubble-they" id="msgT1">阿帕次阿帕次阿帕次。</div>
  <div class="bubble-they" id="msgT2">阿帕次阿帕次阿帕次apcapcapcapcapcapcapcapcapcapcapcapcapcapcapcapcapc676791917878676791917878676791917878676791917878。</div>
</div>

<div class="choice-wrap" id="choiceArea">
  <button class="choice-btn" id="opt1">我明白了</button>
  <button class="choice-btn" id="opt2">我想要了解更多</button>
</div>

<div class="fake-input">iMessage</div>

<script>
const chatBox = document.getElementById("chatBox");
const choiceArea = document.getElementById("choiceArea");

const replySet = {
  "我明白了": "很好。记住今天你做出的这个选择，后面我会慢慢验证。",
  "我想要了解更多": "很聪明。愿意多了解代表你不是一时冲动，那我就和你讲得细一点。"
};

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

async function startSequence(){
  await sleep(550);
  document.getElementById("msgT1").classList.add("show");
  await sleep(950);
  document.getElementById("msgT2").classList.add("show");
  await sleep(850);
  document.getElementById("opt1").classList.add("show");
  document.getElementById("opt2").classList.add("show");
}

document.getElementById("opt1").onclick = async ()=>{
  choiceArea.style.display = "none";
  const myBubble = createBubbleMe("我明白了");
  chatBox.appendChild(myBubble);
  requestAnimationFrame(()=>myBubble.classList.add("show"));
  window.scrollTo(0, document.body.scrollHeight);

  await sleep(720);
  const theyBubble = createBubbleThey(replySet["我明白了"]);
  chatBox.appendChild(theyBubble);
  requestAnimationFrame(()=>theyBubble.classList.add("show"));
  window.scrollTo(0, document.body.scrollHeight);
};

document.getElementById("opt2").onclick = async ()=>{
  choiceArea.style.display = "none";
  const myBubble = createBubbleMe("我想要了解更多");
  chatBox.appendChild(myBubble);
  requestAnimationFrame(()=>myBubble.classList.add("show"));
  window.scrollTo(0, document.body.scrollHeight);

  await sleep(720);
  const theyBubble = createBubbleThey(replySet["我想要了解更多"]);
  chatBox.appendChild(theyBubble);
  requestAnimationFrame(()=>theyBubble.classList.add("show"));
  window.scrollTo(0, document.body.scrollHeight);
};

function createBubbleMe(text){
  const el = document.createElement('div');
  el.className = "bubble-me";
  el.innerText = text;
  return el;
}
function createBubbleThey(text){
  const el = document.createElement('div');
  el.className = "bubble-they";
  el.innerText = text;
  return el;
}

startSequence();
</script>

</body>
</html>
